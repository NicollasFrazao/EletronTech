name: Feature request
description: Propose a calculator, a rule or a screen.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a user cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want; for a calculation, its inputs, outputs and the standard or source it follows.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the roadmap in issue #2, the out-of-scope list in .context/docs/project-overview.md and .context/docs/tech-debt.md
          required: true
