name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# CodeQL has no PHP analyser: it covers the JavaScript (resources/js and the tool configs). PHP is
# covered by Larastan at max level with phpstan-strict-rules (the `phpstan` job of ci.yml).
jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
